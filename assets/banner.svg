<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="accent-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="accent-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes floatSlow3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes barGrow1 {
        0%, 100% { width: 140px; }
        50% { width: 175px; }
      }
      @keyframes barGrow2 {
        0%, 100% { width: 110px; }
        50% { width: 155px; }
      }
      @keyframes barGrow3 {
        0%, 100% { width: 160px; }
        50% { width: 120px; }
      }
      @keyframes sweepScan {
        0% { transform: translateX(0); opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { transform: translateX(360px); opacity: 0.2; }
      }
      .anim-pulse { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
      .anim-float1 { animation: floatSlow1 5s ease-in-out infinite; }
      .anim-float2 { animation: floatSlow2 6.5s ease-in-out infinite; }
      .anim-float3 { animation: floatSlow3 5.5s ease-in-out infinite; }
      .bar-1 { animation: barGrow1 4.5s ease-in-out infinite; }
      .bar-2 { animation: barGrow2 5.2s ease-in-out infinite; }
      .bar-3 { animation: barGrow3 4.8s ease-in-out infinite; }
      .scan-line { animation: sweepScan 4s linear infinite; }
    </style>
  </defs>

  <!-- Deep canvas background -->
  <rect width="1200" height="360" fill="url(#bg-grad)" />

  <!-- Ambient background glow spheres (Dynamic) -->
  <g class="anim-pulse" opacity="0.4">
    <circle cx="180" cy="70" r="140" fill="#38bdf8" filter="url(#subtle-blur)" />
    <circle cx="1020" cy="280" r="150" fill="#a855f7" filter="url(#subtle-blur)" />
    <circle cx="920" cy="80" r="120" fill="#06b6d4" filter="url(#subtle-blur)" />
  </g>

  <!-- High-tech Grid Background Pattern -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" stroke-dasharray="4 4" />
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="4 4" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke-dasharray="4 4" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke-dasharray="4 4" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke-dasharray="4 4" />
    
    <line x1="150" y1="0" x2="150" y2="360" stroke-dasharray="4 4" />
    <line x1="300" y1="0" x2="300" y2="360" stroke-dasharray="4 4" />
    <line x1="450" y1="0" x2="450" y2="360" stroke-dasharray="4 4" />
    <line x1="600" y1="0" x2="600" y2="360" stroke-dasharray="4 4" />
    <line x1="750" y1="0" x2="750" y2="360" stroke-dasharray="4 4" />
    <line x1="900" y1="0" x2="900" y2="360" stroke-dasharray="4 4" />
    <line x1="1050" y1="0" x2="1050" y2="360" stroke-dasharray="4 4" />
  </g>

  <!-- DYNAMIC RIGHT-SIDE CARDS & WORKLOAD VISUALIZATION -->
  <!-- Backing Widget: Resource Allocation Timeline & Utilization (Self-contained in right side: x=750..1140, y=35..325) -->
  <g transform="translate(730, 35)">
    <!-- Main Glass Widget Container -->
    <rect width="420" height="290" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Widget Header -->
    <rect width="420" height="38" rx="14" fill="#1e293b" opacity="0.6" />
    <circle cx="20" cy="19" r="5" fill="#ef4444" />
    <circle cx="36" cy="19" r="5" fill="#f59e0b" />
    <circle cx="52" cy="19" r="5" fill="#10b981" />
    <text x="75" y="23" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">CAPACITY &amp; ALLOCATION MONITOR</text>
    <rect x="330" y="11" width="74" height="18" rx="9" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
    <circle cx="340" cy="20" r="3" fill="#10b981" />
    <text x="349" y="23" fill="#34d399" font-size="10" font-weight="700">OPTIMIZED</text>

    <!-- Floating Metric Card 1 (Engineering Team) -->
    <g class="anim-float1" transform="translate(18, 50)">
      <rect width="384" height="64" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1" />
      <text x="14" y="24" fill="#f8fafc" font-size="13" font-weight="600">Core Engineering</text>
      <text x="14" y="44" fill="#94a3b8" font-size="11">Allocated: 340h / 380h</text>
      <text x="335" y="24" fill="#38bdf8" font-size="13" font-weight="700">89%</text>
      <!-- Track -->
      <rect x="14" y="52" width="356" height="5" rx="2.5" fill="#334155" />
      <!-- Animated Bar -->
      <rect class="bar-1" x="14" y="52" height="5" rx="2.5" fill="url(#accent-cyan)" />
    </g>

    <!-- Floating Metric Card 2 (Design & Product) -->
    <g class="anim-float2" transform="translate(18, 124)">
      <rect width="384" height="64" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1" />
      <text x="14" y="24" fill="#f8fafc" font-size="13" font-weight="600">Design &amp; Architecture</text>
      <text x="14" y="44" fill="#94a3b8" font-size="11">Allocated: 210h / 280h</text>
      <text x="335" y="24" fill="#818cf8" font-size="13" font-weight="700">75%</text>
      <!-- Track -->
      <rect x="14" y="52" width="356" height="5" rx="2.5" fill="#334155" />
      <!-- Animated Bar -->
      <rect class="bar-2" x="14" y="52" height="5" rx="2.5" fill="url(#accent-indigo)" />
    </g>

    <!-- Floating Metric Card 3 (Data & Analytics) -->
    <g class="anim-float3" transform="translate(18, 198)">
      <rect width="384" height="64" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1" />
      <text x="14" y="24" fill="#f8fafc" font-size="13" font-weight="600">Operations &amp; Delivery</text>
      <text x="14" y="44" fill="#94a3b8" font-size="11">Allocated: 295h / 310h</text>
      <text x="335" y="24" fill="#34d399" font-size="13" font-weight="700">95%</text>
      <!-- Track -->
      <rect x="14" y="52" width="356" height="5" rx="2.5" fill="#334155" />
      <!-- Animated Bar -->
      <rect class="bar-3" x="14" y="52" height="5" rx="2.5" fill="url(#accent-emerald)" />
    </g>

    <!-- Subtle timeline grid indicator on widget bottom -->
    <g opacity="0.4" transform="translate(18, 272)">
      <line x1="0" y1="0" x2="384" y2="0" stroke="#475569" stroke-dasharray="2 3" />
      <line class="scan-line" x1="0" y1="-8" x2="24" y2="-8" stroke="#38bdf8" stroke-width="2" />
    </g>
  </g>

  <!-- FOREGROUND TEXT CONTENT (Positioned clearly on the left, high contrast, guaranteed unobstructed) -->
  <g transform="translate(64, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="216" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8" />
      <text x="28" y="19" fill="#e2e8f0" font-size="11" font-weight="700" letter-spacing="1">CURATED RESOURCE HUB</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" fill="#ffffff" font-size="36" font-weight="800" letter-spacing="-0.5">
      Awesome Resource Allocation
    </text>
    <text x="0" y="176" fill="url(#primary-glow)" font-size="34" font-weight="800" letter-spacing="-0.5">
      &amp; Capacity Planning
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="222" fill="#94a3b8" font-size="15" font-weight="400" line-height="22">
      <tspan x="0" dy="0">Top platforms for workload visualization, utilization balancing, and</tspan>
      <tspan x="0" dy="22">team availability forecasting across SaaS and Open-Source ecosystems.</tspan>
    </text>

    <!-- Feature Tag Badges -->
    <g transform="translate(0, 276)">
      <!-- Badge 1: SaaS & Open Source -->
      <g transform="translate(0, 0)">
        <rect width="168" height="32" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="14" cy="16" r="3.5" fill="#38bdf8" />
        <text x="26" y="20" fill="#cbd5e1" font-size="12" font-weight="600">SaaS &amp; Self-Hosted</text>
      </g>

      <!-- Badge 2: Workload Balancing -->
      <g transform="translate(178, 0)">
        <rect width="166" height="32" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="14" cy="16" r="3.5" fill="#818cf8" />
        <text x="26" y="20" fill="#cbd5e1" font-size="12" font-weight="600">Workload Balancing</text>
      </g>

      <!-- Badge 3: What-if Simulation -->
      <g transform="translate(354, 0)">
        <rect width="170" height="32" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="14" cy="16" r="3.5" fill="#34d399" />
        <text x="26" y="20" fill="#cbd5e1" font-size="12" font-weight="600">What-If Forecasting</text>
      </g>
    </g>
  </g>

  <!-- Border Frame Accent -->
  <rect width="1200" height="360" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8" />
</svg>